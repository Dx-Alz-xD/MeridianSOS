<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MeridianSOS — Palar Basin flood response</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#0B1E26; --hydro:#15697A; --hydro-2:#1E8A9C; --silt:#A9803F;
  --signal:#D93A22; --signal-2:#F05A3E; --amber:#C4742A; --grass:#3F7A4B;
  --paper:#EDEFEC; --surface:#FBFBF9; --surface-2:#F3F4F1; --line:#D3D8D4;
  --ink:#0E1F27; --ink-2:#41565F; --ink-3:#6E8189;
  --board:#0C222B; --board-line:#1C3B47; --board-ink:#CFE3E7;
  --radius:10px; --radius-s:6px;
  --shadow:0 1px 0 rgba(14,31,39,.06), 0 8px 24px -18px rgba(14,31,39,.55);
  --rail:248px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#081419; --surface:#0E2028; --surface-2:#132831; --line:#20404B;
    --ink:#E4EDEF; --ink-2:#9FB6BD; --ink-3:#77939C;
    --hydro:#3FA3B5; --hydro-2:#59BDCE; --silt:#CFA063; --signal:#F2634A;
    --signal-2:#FF7E66; --amber:#E39A52; --grass:#63A874;
    --board:#061016; --board-line:#1A343F; --board-ink:#D6EBEF;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 28px -20px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#081419; --surface:#0E2028; --surface-2:#132831; --line:#20404B;
  --ink:#E4EDEF; --ink-2:#9FB6BD; --ink-3:#77939C;
  --hydro:#3FA3B5; --hydro-2:#59BDCE; --silt:#CFA063; --signal:#F2634A;
  --signal-2:#FF7E66; --amber:#E39A52; --grass:#63A874;
  --board:#061016; --board-line:#1A343F; --board-ink:#D6EBEF;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 28px -20px rgba(0,0,0,.9);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
  overflow:hidden;
}
h1,h2,h3,h4{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;font-weight:600;letter-spacing:.01em;margin:0}
h1{font-size:1.5rem;line-height:1.2}
h2{font-size:1.22rem;line-height:1.25}
h3{font-size:1.02rem}
p{margin:0 0 .7em}
a{color:var(--hydro);text-underline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hydro-2);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100%}
#pinbar{flex:0 0 auto}
#shell{flex:1 1 auto;display:flex;min-height:0}
#rail{
  flex:0 0 var(--rail);width:var(--rail);background:var(--surface);
  border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
}
#brand{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
#brand .wordmark{display:flex;align-items:center;gap:9px}
#brand .mk{width:26px;height:26px;flex:0 0 26px}
#brand b{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:1.12rem;letter-spacing:.005em;font-weight:700}
#brand .sub{font-size:.74rem;color:var(--ink-3);margin-top:3px;letter-spacing:.02em}
#nav{flex:1 1 auto;overflow-y:auto;padding:8px}
.navbtn{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;margin:1px 0;
  background:none;border:0;border-radius:var(--radius-s);cursor:pointer;text-align:left;
  color:var(--ink-2);font-size:.92rem;
}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:600;box-shadow:inset 2px 0 0 var(--hydro)}
.navbtn svg{width:17px;height:17px;flex:0 0 17px;opacity:.9}
.navbtn .count{margin-left:auto;font-size:.72rem;padding:1px 6px;border-radius:20px;background:var(--hydro);color:#fff;font-family:"IBM Plex Mono",monospace}
.navbtn .count.hot{background:var(--signal)}
#railfoot{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:8px}
#railfoot .who{min-width:0;flex:1}
#railfoot .who .n{font-size:.84rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#railfoot .who .r{font-size:.72rem;color:var(--ink-3)}
.avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--surface-2);flex:0 0 26px}
#main{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#tabbar{display:none}

@media (max-width:860px){
  #rail{display:none}
  #tabbar{
    display:flex;flex:0 0 auto;border-top:1px solid var(--line);background:var(--surface);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #tabbar button{flex:1;background:none;border:0;padding:7px 2px 6px;color:var(--ink-3);font-size:.63rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
  #tabbar button[aria-current="page"]{color:var(--hydro)}
  #tabbar svg{width:19px;height:19px}
  #tabbar .dot{position:absolute;top:5px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--signal)}
  #app{padding-bottom:0}
}

/* ---------- generic ---------- */
.view{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;scroll-padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:1040px;margin:0 auto;padding:20px 18px 40px}
.viewhead{padding:18px 18px 0;max-width:1040px;margin:0 auto}
.viewhead .lede{color:var(--ink-2);max-width:62ch;font-size:.93rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel + .panel{margin-top:14px}
.pad{padding:16px}
.rowlist > *{border-top:1px solid var(--line)}
.rowlist > *:first-child{border-top:0}
.sec{margin-top:26px}
.sec > h2{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.sec > h2 .hint{font-size:.78rem;color:var(--ink-3);font-weight:400;font-family:"IBM Plex Sans",sans-serif}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--radius-s);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:.88rem;font-weight:500;
}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--hydro);border-color:var(--hydro);color:#fff}
.btn.primary:hover{background:var(--hydro-2);border-color:var(--hydro-2)}
.btn.danger{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.danger:hover{background:var(--signal-2);border-color:var(--signal-2)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn svg{width:15px;height:15px}
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=search],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-s);
  background:var(--surface);color:var(--ink);
}
textarea{resize:vertical;min-height:72px;font-family:inherit}
label.fld{display:block;margin-bottom:12px}
label.fld > span{display:block;font-size:.8rem;color:var(--ink-2);margin-bottom:4px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.73rem;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.tag.hot{border-color:var(--signal);color:var(--signal);background:transparent}
.tag.warn{border-color:var(--amber);color:var(--amber);background:transparent}
.tag.ok{border-color:var(--grass);color:var(--grass);background:transparent}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3);font-size:.9rem}
.empty b{display:block;color:var(--ink-2);font-weight:600;margin-bottom:3px}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
hr.rule{border:0;border-top:1px solid var(--line);margin:16px 0}

/* ---------- pinned SOS bar + announcement ---------- */
#pinbar > *{border-bottom:1px solid rgba(0,0,0,.14)}
.pin{
  display:flex;align-items:center;gap:12px;padding:9px 14px;
  padding-top:calc(9px + env(safe-area-inset-top,0px));
  background:var(--signal);color:#fff;font-size:.9rem;
}
.pin .pulse{width:9px;height:9px;border-radius:50%;background:#fff;flex:0 0 9px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}
.pin .txt{flex:1;min-width:0}
.pin .txt b{font-weight:600}
.pin .txt .meta{font-size:.76rem;opacity:.85}
.pin .acts{display:flex;gap:6px;flex-shrink:0}
.pin .acts button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;padding:4px 10px;border-radius:var(--radius-s);cursor:pointer;font-size:.8rem;font-weight:500;white-space:nowrap}
.pin .acts button:hover{background:rgba(255,255,255,.28)}
.pin .more{font-size:.76rem;opacity:.85;white-space:nowrap}
.ann{
  display:flex;gap:10px;align-items:flex-start;padding:9px 14px;background:var(--board);color:var(--board-ink);font-size:.88rem;
}
.ann .from{font-size:.72rem;color:var(--hydro-2);font-weight:600;display:block}
@media (max-width:640px){
  .pin{flex-wrap:wrap;gap:8px}
  .pin .acts{width:100%}
  .pin .acts button{flex:1}
}

/* ---------- gauge board (dashboard hero) ---------- */
.board{background:var(--board);border-radius:var(--radius);padding:16px 14px 10px;color:var(--board-ink);overflow:hidden}
.board .bhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;padding:0 4px}
.board .bhead h2{color:#fff;font-size:1.06rem}
.board .bhead .when{font-size:.74rem;color:#7FA5AF;font-family:"IBM Plex Mono",monospace}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px;background:var(--board-line)}
.gauge{background:var(--board);padding:12px;position:relative}
.gauge .nm{font-size:.78rem;color:#8FB4BE;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge .val{font-family:"IBM Plex Mono",monospace;font-size:1.72rem;font-weight:500;line-height:1;color:#fff;display:flex;align-items:baseline;gap:4px}
.gauge .val small{font-size:.72rem;color:#7FA5AF;font-weight:400}
.gauge .trend{font-size:.74rem;margin-top:3px;font-family:"IBM Plex Mono",monospace}
.gauge .bar{margin-top:10px;height:5px;background:#16313C;border-radius:3px;position:relative;overflow:hidden}
.gauge .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;display:block}
.gauge .danger{position:absolute;top:-3px;bottom:-3px;width:2px;background:#F05A3E}
.gauge .lv{font-size:.7rem;color:#6E96A1;margin-top:5px;font-family:"IBM Plex Mono",monospace}
.g-normal i{background:#2FA3B8} .g-watch i{background:#D8A75A} .g-warning i{background:#E08A3C} .g-danger i{background:#F05A3E}

.statusstrip{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.stat{flex:1 1 130px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px}
.stat .k{font-size:.76rem;color:var(--ink-3)}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:1.4rem;font-weight:500;line-height:1.15;margin-top:2px}
.stat.alarm .v{color:var(--signal)}
.stat .s{font-size:.74rem;color:var(--ink-3)}

.levelbanner{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius);border:1px solid;margin-bottom:14px}
.levelbanner .dial{width:44px;height:44px;flex:0 0 44px}
.levelbanner h2{font-size:1.12rem}
.levelbanner p{margin:0;font-size:.86rem;opacity:.9}
.lb-normal{border-color:var(--grass);background:color-mix(in srgb,var(--grass) 9%,transparent);color:var(--ink)}
.lb-watch{border-color:var(--silt);background:color-mix(in srgb,var(--silt) 12%,transparent);color:var(--ink)}
.lb-warning{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 13%,transparent);color:var(--ink)}
.lb-evacuate{border-color:var(--signal);background:color-mix(in srgb,var(--signal) 13%,transparent);color:var(--ink)}

/* ---------- map ---------- */
.mapwrap{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto;touch-action:pan-y}
.zone{cursor:pointer;transition:opacity .12s}
.zone:hover{opacity:.82}
.zlabel{font-size:9px;font-family:"IBM Plex Sans Condensed",sans-serif;fill:var(--ink);pointer-events:none;letter-spacing:.02em}
.riverline{fill:none;stroke:var(--hydro);stroke-linecap:round}
.maplegend{display:flex;flex-wrap:wrap;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:.76rem;color:var(--ink-2)}
.maplegend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:11px;height:11px;border-radius:3px;display:inline-block}
.mapinfo{padding:12px 14px;border-top:1px solid var(--line);font-size:.88rem}

/* ---------- chat ---------- */
#chatview{display:flex;flex:1 1 auto;height:100%;min-height:0}
#chanlist{flex:0 0 212px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;min-height:0}
#chanlist .grp{font-size:.72rem;color:var(--ink-3);padding:12px 12px 4px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
#chanlist .grp button{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:1.05rem;line-height:1;padding:0 2px}
.chan{display:flex;align-items:center;gap:8px;width:100%;padding:7px 12px;background:none;border:0;cursor:pointer;text-align:left;color:var(--ink-2);font-size:.9rem}
.chan:hover{background:var(--surface-2)}
.chan[aria-current="true"]{background:var(--surface-2);color:var(--ink);font-weight:600;box-shadow:inset 2px 0 0 var(--hydro)}
.chan .hash{color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.chan .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan .n{font-size:.7rem;background:var(--signal);color:#fff;border-radius:20px;padding:0 6px;font-family:"IBM Plex Mono",monospace}
.presencedot{width:7px;height:7px;border-radius:50%;background:var(--grass);flex:0 0 7px}
.presencedot.off{background:var(--line)}
#chatmain{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
#chathead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);flex:0 0 auto}
#chathead .t{flex:1;min-width:0}
#chathead h3{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chathead .sub{font-size:.75rem;color:var(--ink-3)}
#msgs{flex:1 1 auto;overflow-y:auto;padding:14px 14px 6px;min-height:0}
.msg{display:flex;gap:9px;padding:3px 0;position:relative}
.msg .av{width:30px;flex:0 0 30px}
.msg .av img{width:30px;height:30px;border-radius:50%;background:var(--surface-2)}
.msg .bd{flex:1;min-width:0}
.msg .hd{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.msg .hd b{font-size:.88rem;font-weight:600}
.msg .hd .ts{font-size:.7rem;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.msg .hd .role{font-size:.66rem;padding:0 5px;border-radius:3px;background:var(--hydro);color:#fff}
.msg .tx{font-size:.93rem;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.cont{padding-top:0}
.msg.cont .av{visibility:hidden;height:0}
.msg:hover .tools{opacity:1}
.tools{position:absolute;right:0;top:-8px;display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:2px;opacity:0;transition:opacity .1s;box-shadow:var(--shadow)}
.tools button{background:none;border:0;cursor:pointer;padding:3px 5px;border-radius:4px;font-size:.85rem;line-height:1;color:var(--ink-2)}
.tools button:hover{background:var(--surface-2)}
@media (hover:none){.tools{opacity:1;position:static;border:0;box-shadow:none;background:none;padding:0;margin-top:2px}}
.replyq{border-left:2px solid var(--hydro);padding:1px 0 1px 8px;margin-bottom:3px;font-size:.78rem;color:var(--ink-3)}
.replyq b{color:var(--ink-2)}
.reacts{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.react{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface-2);border-radius:20px;padding:0 7px;font-size:.78rem;cursor:pointer;line-height:1.6}
.react.mine{border-color:var(--hydro);background:color-mix(in srgb,var(--hydro) 14%,transparent)}
.daysep{display:flex;align-items:center;gap:10px;margin:14px 0 8px;color:var(--ink-3);font-size:.74rem}
.daysep::before,.daysep::after{content:"";flex:1;height:1px;background:var(--line)}
.sysmsg{text-align:center;font-size:.76rem;color:var(--ink-3);padding:5px 0}
.linkcard{display:block;border:1px solid var(--line);border-left:3px solid var(--hydro);border-radius:var(--radius-s);padding:7px 10px;margin-top:6px;max-width:420px;text-decoration:none;background:var(--surface-2)}
.linkcard .host{font-size:.74rem;color:var(--hydro);font-weight:600}
.linkcard .path{font-size:.8rem;color:var(--ink-2);word-break:break-all}
.voice{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:20px;padding:5px 12px 5px 6px;margin-top:5px;max-width:300px;background:var(--surface-2)}
.voice button{width:28px;height:28px;border-radius:50%;border:0;background:var(--hydro);color:#fff;cursor:pointer;flex:0 0 28px;display:flex;align-items:center;justify-content:center}
.voice .wave{flex:1;display:flex;align-items:center;gap:2px;height:20px}
.voice .wave i{flex:1;background:var(--hydro);opacity:.45;border-radius:1px;min-width:2px}
.voice .dur{font-family:"IBM Plex Mono",monospace;font-size:.76rem;color:var(--ink-3)}

.sos{border:1px solid var(--signal);border-left:4px solid var(--signal);border-radius:var(--radius);background:color-mix(in srgb,var(--signal) 7%,var(--surface));padding:11px 13px;margin:8px 0;max-width:560px}
.sos.resolved{border-color:var(--line);border-left-color:var(--ink-3);background:var(--surface-2);opacity:.72}
.sos.resolved .sostitle{color:var(--ink-3)}
.sostitle{display:flex;align-items:center;gap:8px;font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:1rem;color:var(--signal)}
.sos .note{font-size:.92rem;margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.sos .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sos .acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.sos .resp{font-size:.79rem;color:var(--ink-2);margin-top:7px}
.livedot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--signal);animation:pulse 1.6s infinite}
#composer{flex:0 0 auto;border-top:1px solid var(--line);background:var(--surface);padding:9px 12px;padding-bottom:calc(9px + env(safe-area-inset-bottom,0px))}
#replybar{display:none;align-items:center;gap:8px;font-size:.78rem;color:var(--ink-3);padding:0 2px 6px}
#replybar.on{display:flex}
#typing{height:16px;font-size:.74rem;color:var(--ink-3);padding:0 2px 2px}
.cbox{display:flex;align-items:flex-end;gap:7px}
.cbox textarea{flex:1;min-height:38px;max-height:132px;border-radius:19px;padding:8px 14px;resize:none;line-height:1.4}
.iconbtn{width:38px;height:38px;flex:0 0 38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:17px;height:17px}

<script>

/* ============================================================
   Local server data layer — same shape as the claude.ai
   db / room / user capabilities, backed by this app's own
   server.js over fetch + Server-Sent Events. Everything below
   this block (chat, SOS, alerts, admin, etc.) is unchanged.
   ============================================================ */
function genId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, "").slice(0, 20);
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
}
function avatarFor(id, name, color) {
  const initial = ((name || "?").trim().charAt(0) || "?").toUpperCase();
  const c = color || "#5b8a99";
  const s = "<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><rect width='64' height='64' rx='32' fill='" + c + "'/>" +
    "<text x='32' y='43' font-family='sans-serif' font-size='27' fill='white' text-anchor='middle'>" + initial.replace(/[&<>]/g, "") + "</text></svg>";
  return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(s)));
}
const PALETTE = ["#3F7A4B", "#15697A", "#A9803F", "#7A4B6E", "#4B5E7A", "#7A5A3F", "#4B7A6E", "#7A3F55"];

/* ---- shared SSE stream, fanned out to db/room subscribers ---- */
class Stream {
  constructor(deviceId) {
    this.deviceId = deviceId;
    this.docHandlers = new Set();
    this.presenceHandlers = new Set();
    this.roomHandlers = new Set();
    this._connect();
  }
  _connect() {
    try {
      const es = new EventSource("/api/stream?id=" + encodeURIComponent(this.deviceId));
      es.onmessage = ev => {
        let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.type === "doc") this.docHandlers.forEach(h => h(m.path, m.exists, m.data));
        else if (m.type === "presence") this.presenceHandlers.forEach(h => h(m.peers));
        else if (m.type === "room") this.roomHandlers.forEach(h => h(m.topic, m.data, m.from));
      };
      es.onerror = () => { };
      this.es = es;
    } catch (e) { console.warn("stream unavailable", e); }
  }
}

class LocalDB {
  constructor(stream, deviceId) {
    this.stream = stream; this.deviceId = deviceId;
    this.cache = {}; this.exists = {};
    this.docSubs = {}; this.colSubs = [];
    stream.docHandlers.add((path, exists, data) => this._applyDoc(path, exists, data));
  }
  _hdrs(json) { const h = { "X-Device-Id": this.deviceId }; if (json) h["Content-Type"] = "application/json"; return h; }
  _applyDoc(path, exists, data) {
    this.exists[path] = exists; this.cache[path] = data;
    (this.docSubs[path] || new Set()).forEach(cb => cb({ exists, data: () => data }));
    this.colSubs.forEach(cs => { if (path.startsWith(cs.prefix)) this._emitCol(cs); });
  }
  _emitCol(cs) {
    let rows = Object.keys(this.cache).filter(p => p.startsWith(cs.prefix) && this.exists[p] && p.slice(cs.prefix.length).indexOf("/") === -1)
      .map(p => ({ id: p.slice(cs.prefix.length), _d: this.cache[p] }));
    if (cs.orderField) rows.sort((a, b) => { const av = a._d[cs.orderField], bv = b._d[cs.orderField]; const c = av > bv ? 1 : av < bv ? -1 : 0; return cs.dir === "desc" ? -c : c; });
    if (cs.limitN) rows = rows.slice(0, cs.limitN);
    cs.next({ docs: rows.map(r => ({ id: r.id, data: () => r._d })) });
  }
  async _fetchDoc(path) {
    try {
      const r = await fetch("/api/doc?path=" + encodeURIComponent(path), { headers: this._hdrs() });
      const j = await r.json();
      this.exists[path] = !!j.exists; this.cache[path] = j.data;
    } catch (e) { this.exists[path] = this.exists[path] || false; }
  }
  doc(path) {
    const self = this;
    return {
      async get() { if (!(path in self.exists)) await self._fetchDoc(path); return { exists: !!self.exists[path], data: () => self.cache[path] }; },
      async set(data) {
        const r = await fetch("/api/doc", { method: "POST", headers: self._hdrs(true), body: JSON.stringify({ path, data, merge: false }) });
        if (!r.ok) { const j = await r.json().catch(() => ({})); throw { code: j.code || "invalid_argument", message: j.message || "write failed" }; }
      },
      async update(data) {
        const r = await fetch("/api/doc", { method: "POST", headers: self._hdrs(true), body: JSON.stringify({ path, data, merge: true }) });
        if (!r.ok) { const j = await r.json().catch(() => ({})); throw { code: j.code || "invalid_argument", message: j.message || "write failed" }; }
      },
      async delete() {
        const r = await fetch("/api/doc?path=" + encodeURIComponent(path), { method: "DELETE", headers: self._hdrs() });
        if (!r.ok) throw { code: "invalid_argument", message: "delete failed" };
      },
      onSnapshot(next, err) {
        if (!self.docSubs[path]) self.docSubs[path] = new Set();
        self.docSubs[path].add(next);
        self._fetchDoc(path).then(() => next({ exists: !!self.exists[path], data: () => self.cache[path] })).catch(e => { if (err) err({ code: "unavailable", message: String(e) }); });
        return () => { self.docSubs[path] && self.docSubs[path].delete(next); };
      }
    };
  }
  collection(path) {
    const self = this, prefix = path + "/";
    const builder = (orderField, dir, limitN) => ({
      orderBy(f, d) { return builder(f, d || "asc", limitN); },
      limit(n) { return builder(orderField, dir, n); },
      async get() {
        const r = await fetch("/api/collection?path=" + encodeURIComponent(path), { headers: self._hdrs() });
        let rows = await r.json().catch(() => []);
        rows.forEach(row => { self.exists[prefix + row.id] = true; self.cache[prefix + row.id] = row; });
        if (orderField) rows.sort((a, b) => { const av = a[orderField], bv = b[orderField]; const c = av > bv ? 1 : av < bv ? -1 : 0; return dir === "desc" ? -c : c; });
        if (limitN) rows = rows.slice(0, limitN);
        return { docs: rows.map(r2 => ({ id: r2.id, data: () => r2 })) };
      },
      onSnapshot(next, err) {
        const cs = { prefix, orderField, dir, limitN, next };
        self.colSubs.push(cs);
        fetch("/api/collection?path=" + encodeURIComponent(path), { headers: self._hdrs() }).then(r => r.json()).then(rows => {
          rows.forEach(row => { self.exists[prefix + row.id] = true; self.cache[prefix + row.id] = row; });
          self._emitCol(cs);
        }).catch(e => { if (err) err({ code: "unavailable", message: String(e) }); });
        return () => { const i = self.colSubs.indexOf(cs); if (i >= 0) self.colSubs.splice(i, 1); };
      },
      doc(id) { return self.doc(prefix + (id || genId())); },
      async add(data) { const id = genId(); await self.doc(prefix + id).set(data); return self.doc(prefix + id); }
    });
    return builder(null, null, null);
  }
}

class LocalRoom {
  constructor(stream, deviceId) {
    this.stream = stream; this.deviceId = deviceId;
    this.peerMap = {}; this.peerHandlers = new Set(); this.topicHandlers = {};
    stream.presenceHandlers.add(list => this._onPresence(list));
    stream.roomHandlers.add((topic, data, from) => this._onEvent(topic, data, from));
  }
  _onPresence(list) {
    this.peerMap = {}; list.forEach(p => { this.peerMap[p.id] = p; });
    const arr = list.map(p => ({ peer: p.id, by: p.id, isMe: p.id === this.deviceId, sameTab: p.id === this.deviceId, kind: "viewer", presence: p.presence || {}, updatedAt: p.updatedAt || Date.now() }));
    this.peerHandlers.forEach(h => h({ peers: arr, joined: [], left: [], updated: arr }));
  }
  _onEvent(topic, data, from) {
    (this.topicHandlers[topic] || new Set()).forEach(h => h({ topic, data, peer: from, by: from, isMe: from === this.deviceId, sameTab: from === this.deviceId, kind: "viewer" }));
  }
  async presence(patch) { try { await fetch("/api/presence", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: this.deviceId, patch }) }); } catch (e) { } }
  onPeers(handler) { this.peerHandlers.add(handler); return () => this.peerHandlers.delete(handler); }
  async emit(topic, data) { try { await fetch("/api/emit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: this.deviceId, topic, data }) }); } catch (e) { } }
  on(topic, handler) { if (!this.topicHandlers[topic]) this.topicHandlers[topic] = new Set(); this.topicHandlers[topic].add(handler); return () => this.topicHandlers[topic].delete(handler); }
}

class LocalUser {
  constructor(deviceId, meRef) { this.deviceId = deviceId; this.meRef = meRef; this.cache = {}; }
  async me() { return { id: this.deviceId, name: this.meRef.name || "", avatarUrl: avatarFor(this.deviceId, this.meRef.name, this.meRef.color), color: this.meRef.color, email: null, isOwner: false, canEdit: !!S.isAdmin }; }
  async id() { return this.deviceId; }
  async isOwner() { return false; }
  async canEdit() { return !!S.isAdmin; }
  async can(name) { if (name === "data.write") return true; return !!S.isAdmin; }
  async name() { return this.meRef.name || ""; }
  async avatarUrl() { return avatarFor(this.deviceId, this.meRef.name, this.meRef.color); }
  async profiles(ids) {
    const list = Array.from(new Set((Array.isArray(ids) ? ids : [ids]).filter(Boolean)));
    const need = list.filter(i => !(i in this.cache));
    if (need.length) {
      let r = {};
      try { r = await fetch("/api/people?ids=" + encodeURIComponent(need.join(","))).then(x => x.json()); } catch (e) { }
      need.forEach(i => {
        const p = r[i];
        this.cache[i] = p ? { id: i, name: p.name || "", avatarUrl: avatarFor(i, p.name, p.color), color: p.color || "#888", email: null, isMe: i === this.deviceId }
          : { id: i, name: "", avatarUrl: avatarFor(i, "", "#888"), color: "#888", email: null, isMe: i === this.deviceId };
      });
    }
    const out = {}; list.forEach(i => out[i] = this.cache[i]); return out;
  }
  async search(q) {
    let rows = [];
    try { rows = await fetch("/api/people/search?q=" + encodeURIComponent(q)).then(r => r.json()); } catch (e) { }
    return rows.map(p => ({ id: p.id, name: p.name || "", avatarUrl: avatarFor(p.id, p.name, p.color), color: p.color || "#888", email: null, isMe: p.id === this.deviceId }));
  }
}

/* ---- local identity: device id + display name, kept in localStorage ---- */
function loadDevice() {
  let d = LS.get("device", null);
  if (!d || !d.id) { d = { id: genId(), name: "", color: PALETTE[Math.floor(Math.random() * PALETTE.length)] }; LS.set("device", d); }
  return d;
}
function saveDevice(d) { LS.set("device", d); }
async function registerIdentity(d) {
  try { await fetch("/api/identity", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: d.id, name: d.name, color: d.color }) }); } catch (e) { }
}
function askName() {
  return new Promise(resolve => {
    const root = $("#lobbyroot");
    root.innerHTML = "";
    const input = el("input", { type: "text", maxlength: "40", placeholder: "Your name", "aria-label": "Your name", style: "text-align:center;font-family:inherit;letter-spacing:normal;font-size:1.05rem" });
    const go = () => { const v = input.value.trim(); if (!v) { input.focus(); return; } root.innerHTML = ""; resolve(v); };
    input.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    root.appendChild(el("div", { id: "lobby" }, [
      el("div", { class: "card" }, [
        el("div", { class: "mk", html: '<svg viewBox="0 0 32 32" style="width:100%;height:100%"><circle cx="16" cy="16" r="15" fill="none" stroke="var(--hydro)" stroke-width="1.5"/><path d="M2 19c3.4 0 3.4-3.6 6.8-3.6S12.2 19 15.6 19s3.4-3.6 6.8-3.6S25.8 19 29.2 19" fill="none" stroke="var(--hydro)" stroke-width="1.8" stroke-linecap="round"/><path d="M16 4.5v7M16 14.5v.2" stroke="var(--signal)" stroke-width="2.4" stroke-linecap="round"/></svg>' }),
        el("h1", { text: "MeridianSOS" }),
        el("p", { text: "Running on your local network. What should we call you here?" }),
        el("div", { style: "margin:18px 0 10px" }, [input]),
        el("button", { class: "btn primary", text: "Continue", style: "width:100%;justify-content:center", onclick: go })
      ])
    ]));
    setTimeout(() => input.focus(), 50);
  });
}
"use strict";
/* ============================================================
   MeridianSOS — flood coordination console
   Single-file app. Persistence: claude `db`. Live: `room`. Identity: `user`.
   ============================================================ */

/* ---------- tiny helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, attrs, kids) => {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  if (kids) (Array.isArray(kids) ? kids : [kids]).forEach(c => { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return n;
};
const svg = (d, extra) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  dash: svg('<path d="M3 13h5l2-7 3 14 2.5-7H21"/>'),
  map: svg('<path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4z"/><path d="M9 4v13M15 6.5v13"/>'),
  alert: svg('<path d="M12 3 2.5 20h19L12 3z"/><path d="M12 10v4M12 17.2v.1"/>'),
  shelter: svg('<path d="M3 11 12 4l9 7"/><path d="M5.5 9.7V20h13V9.7"/><path d="M10 20v-5h4v5"/>'),
  report: svg('<path d="M5 3h9l5 5v13H5z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>'),
  chat: svg('<path d="M21 12a8 8 0 0 1-11.7 7.1L4 20.5l1.4-5A8 8 0 1 1 21 12z"/>'),
  prep: svg('<path d="M9 5H6.5A1.5 1.5 0 0 0 5 6.5v13A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-13A1.5 1.5 0 0 0 17.5 5H15"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M8.5 12.5l2 2 4.5-4.5"/>'),
  settings: svg('<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4 5.3 5.3"/>'),
  admin: svg('<path d="M12 3 4 6.2v5.3c0 4.8 3.3 8.9 8 10.2 4.7-1.3 8-5.4 8-10.2V6.2L12 3z"/><path d="M9.2 12.2l2 2 3.6-3.9"/>'),
  send: svg('<path d="M4.5 12 20 4.5 15.5 20 12 13.5 4.5 12z"/>'),
  mic: svg('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/>'),
  sos: svg('<path d="M12 3 2.5 20h19L12 3z"/><path d="M12 10v4M12 17.2v.1"/>'),
  back: svg('<path d="M15 5l-7 7 7 7"/>'),

  const db = S.db;
  sub("meta/config", true, s => { S.config = s.exists ? s.data() : {}; S.rooms = (S.config.rooms || DEFAULT_ROOMS); onConfig(); });
  sub("meta/map", true, s => { const d = s.exists ? s.data() : {}; S.mapcfg = Object.assign({}, DEFAULT_MAP, d); S.gauges = d.gauges || DEFAULT_GAUGES; rerender(); });
  sub(db.collection("alerts").orderBy("ts", "desc").limit(60), false, s => { S.alerts = docsOf(s); notifyNewAlerts(); rerender(); });
  sub(db.collection("shelters").limit(80), false, s => { S.shelters = docsOf(s); rerender(); });
  sub(db.collection("reports").orderBy("ts", "desc").limit(120), false, s => { S.reports = docsOf(s); rerender(); });
  sub(db.collection("checkins").limit(300), false, s => { S.checkins = docsOf(s); rerender(); });
  sub(db.collection("members").limit(300), false, s => {

    if (S.me.id && m[S.me.id] && m[S.me.id].removed) renderRemoved();
    recomputeAdmin(); rerender();
  });
  sub(db.collection("messages").orderBy("ts", "desc").limit(260), false, s => {
    const prev = S.messages;
    S.messages = docsOf(s).reverse();
    onMessages(prev);
  });

  if (S.isAdmin) sub(db.collection("addresses").limit(400), false, s => { S.addresses = docsOf(s); if (S.view === "admin") rerender(); });

function wireRoom() {
  if (!S.room) return;
  try {
    S.room.presence({ uid: S.me.id || "anon", view: S.view, chan: chanKey(), ts: Date.now() });
    S.room.onPeers(ch => { S.peers = ch.peers.filter(p => p.kind === "viewer"); if (S.view === "chat") renderChatSidebars(); });
    S.room.on("typing", m => {
      if (m.isMe) return;
      const d = m.data || {};
      if (!d.uid || d.chan !== chanKey()) return;
      S.typing[d.uid] = Date.now();
      paintTyping();
    });
  } catch (e) { }
}
function pushPresence() { if (S.room) S.room.presence({ uid: S.me.id || "anon", view: S.view, chan: chanKey(), ts: Date.now() }).catch(() => { }); }
let typingSentAt = 0;
function sendTyping() {
  if (!S.room) return;
  const t = Date.now(); if (t - typingSentAt < 2600) return; typingSentAt = t;
  S.room.emit("typing", { uid: S.me.id || "anon", chan: chanKey() }).catch(() => { });
}
function paintTyping() {
  const box = $("#typing"); if (!box) return;
  const cut = Date.now() - 5200;
  const ids = Object.keys(S.typing).filter(k => S.typing[k] > cut && k !== S.me.id);
  if (!ids.length) { box.textContent = ""; return; }
  resolveProfiles(ids).then(ps => {
    const names = ids.map(i => (ps[i] && ps[i].name) || "Someone");
    box.textContent = names.length === 1 ? names[0] + " is typing…" : names.length === 2 ? names.join(" and ") + " are typing…" : "Several people are typing…";
  });
}
setInterval(() => { if (S.view === "chat") paintTyping(); }, 2000);

async function resolveProfiles(ids) {
  const list = Array.from(new Set(ids.filter(Boolean)));
  if (!S.user || !list.length) { const o = {}; list.forEach(i => o[i] = { name: "", avatarUrl: "", color: "#8aa" }); return o; }
  try { const ps = await S.user.profiles(list); Object.assign(S.profileCache, ps); return ps; }
  catch (e) { const o = {}; list.forEach(i => o[i] = { name: "", avatarUrl: "", color: "#8aa" }); return o; }
}

async function sendText() {

  if (!S.db) return toast("Shared data isn't available in this view.", true);

    const id = S.editing; S.editing = null; inp.value = ""; autosize(inp); cancelReply();

    return;
  }

    dm: S.chan.type === "dm" ? S.chan.id : null,
    replyTo: S.reply || null

async function react(id, emoji) {
  const m = S.messages.find(x => x.id === id); if (!m) return;
  const r = Object.assign({}, m.reactions || {});
  const who = new Set(r[emoji] || []);
  if (who.has(S.me.id)) who.delete(S.me.id); else who.add(S.me.id);
  if (who.size) r[emoji] = Array.from(who); else delete r[emoji];
  try { await S.db.doc("messages/" + id).update({ reactions: r }); } catch (e) { }
}

/* ---------- voice notes ---------- */
let rec = null, recChunks = [], recStart = 0, recTimer = null;
async function toggleRecord() {
  const btn = $("#micbtn");
  if (rec && rec.state === "recording") { rec.stop(); return; }
  if (isMuted()) return toast("You're muted in this group.", true);
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast("This browser can't record audio.", true);
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { return toast("Microphone access was refused.", true); }
  const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"];
  const mime = types.find(t => MediaRecorder.isTypeSupported(t)) || "";
  rec = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 24000 } : undefined);
  recChunks = []; recStart = Date.now();
  rec.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    btn.classList.remove("rec"); btn.innerHTML = ICON.mic; clearInterval(recTimer);
    const dur = Math.round((Date.now() - recStart) / 1000);
    const blob = new Blob(recChunks, { type: mime || "audio/webm" });
    rec = null;
    if (dur < 1) return toast("Too short.");
    if (blob.size > 170000) return toast("That note is too long to store. Keep voice notes under about 30 seconds.", true);
    const b64 = await blobToB64(blob);
    const mid = "m" + uid();
    try {
      await S.db.doc("media/" + mid).set({ b64, mime: blob.type, dur, ts: nowIso() });
      await S.db.doc("messages/" + mid).set({
        kind: "voice", uid: S.me.id || "anon", ts: nowIso(), text: "", reactions: {}, dur,
        room: S.chan.type === "room" ? S.chan.id : null, dm: S.chan.type === "dm" ? S.chan.id : null,
        replyTo: S.reply || null, media: mid
      });
      cancelReply();
    } catch (e) { toast("Couldn't send the voice note.", true); }
  };
  rec.start();
  btn.classList.add("rec");
  recTimer = setInterval(() => {
    const s = Math.round((Date.now() - recStart) / 1000);
    btn.textContent = String(s);
    if (s >= 30) rec.stop();
  }, 250);
  toast("Recording — tap again to send. Stops at 30 seconds.");
}
function blobToB64(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(b); }); }
const audioCache = {};
function renderVoice(m) {
  const box = el("div", { class: "voice" });
  const btn = el("button", { html: ICON.play, "aria-label": "Play voice note" });
  const wave = el("div", { class: "wave" });
  for (let i = 0; i < 26; i++) { const h = 18 + 72 * Math.abs(Math.sin((i + (m.id.charCodeAt(2) % 7)) * 1.1)); wave.appendChild(el("i", { style: "height:" + h + "%" })); }
  const dur = el("span", { class: "dur", text: (m.dur || 0) + "s" });
  let audio = null;
  btn.addEventListener("click", async () => {
    if (audio && !audio.paused) { audio.pause(); btn.innerHTML = ICON.play; return; }
    if (!audio) {
      btn.textContent = "…";
      try {
        let d = audioCache[m.media];
        if (!d) { const snap = await S.db.doc("media/" + m.media).get(); if (!snap.exists) throw new Error("gone"); d = snap.data(); audioCache[m.media] = d; }
        audio = new Audio("data:" + (d.mime || "audio/webm") + ";base64," + d.b64);
        audio.onended = () => { btn.innerHTML = ICON.play; };
      } catch (e) { btn.innerHTML = ICON.play; return toast("That voice note is no longer stored.", true); }
    }
    audio.play(); btn.innerHTML = ICON.pause;
  });
  box.appendChild(btn); box.appendChild(wave); box.appendChild(dur);
  return box;
}

function ll2xy(lat, lng) {

  const x = ((lng - c.west) / (c.east - c.west)) * 260;
  const y = ((c.north - lat) / (c.north - c.south)) * 210;

}

    const b = el("button", { text: t, onclick: () => { LS.set("theme", t); applyTheme(); Array.from(th.children).forEach(c => c.setAttribute("aria-pressed", c === b ? "true" : "false")); } });
    b.setAttribute("aria-pressed", LS.get("theme", "auto") === t ? "true" : "false");
    th.appendChild(b);
  });
  dp.appendChild(el("hr", { class: "rule" }));
  dp.appendChild(el("label", { class: "fld" }, [el("span", { text: "Theme" }), th]));
  dsec.appendChild(dp); w.appendChild(dsec);

  if (!S.isAdmin) {
    const asec = el("div", { class: "sec" }, [el("h2", {}, [el("span", { text: "Claim admin access" })])]);
    const ap = el("div", { class: "panel pad" });
    ap.appendChild(el("p", { class: "muted", style: "font-size:.87rem", text: "Whoever is running the server can read the admin code printed in its terminal window. Enter it here once to become an administrator on this device." }));
    const code = el("input", { type: "text", inputmode: "numeric", placeholder: "code from the terminal", class: "mono", style: "max-width:220px" });
    ap.appendChild(el("label", { class: "fld" }, [el("span", { text: "Admin code" }), code]));
    ap.appendChild(el("button", { class: "btn primary", text: "Claim admin access", onclick: async () => { if (await claimAdmin(code.value.trim())) rerender(); } }));
    asec.appendChild(ap); w.appendChild(asec);
  }

  v.appendChild(w); return v;
}

/* ---------- admin ---------- */
function knownPeople() {
  const ids = new Set();
  S.messages.forEach(m => ids.add(m.uid));
  S.reports.forEach(r => ids.add(r.uid));
  S.checkins.forEach(c => ids.add(c.id));
  S.addresses.forEach(a => ids.add(a.id));
  Object.keys(S.members).forEach(k => ids.add(k));
  S.peers.forEach(p => p.presence && p.presence.uid && ids.add(p.presence.uid));
  if (S.me.id) ids.add(S.me.id);
  return Array.from(ids).filter(x => x && x !== "anon");
}
function viewAdmin() {
  const v = el("div");
  v.appendChild(head("Control room", "Set the district status, reach everyone at once, and manage who's in the group."));
  const w = el("div", { class: "wrap" });

  /* status + announcement */
  const p1 = el("div", { class: "panel pad" });
  p1.appendChild(el("h3", { text: "District status" }));
  const seg = el("div", { class: "seg", style: "margin:8px 0 14px" });
  ["normal", "watch", "warning", "evacuate"].forEach(l => {
    const b = el("button", { text: LEVELS[l].t, onclick: async () => { try { await S.db.doc("meta/config").update({ level: l, updatedAt: nowIso() }); toast("Status set to " + LEVELS[l].t + "."); } catch (e) { toast("Couldn't set the status.", true); } } });
    b.setAttribute("aria-pressed", (S.config.level || "normal") === l ? "true" : "false");
    seg.appendChild(b);
  });
  p1.appendChild(seg);
  const ann = el("textarea", { placeholder: "One banner across the top of everyone's screen. Leave empty to clear it." });
  ann.value = S.config.announcement || "";
  p1.appendChild(el("label", { class: "fld" }, [el("span", { text: "Announcement banner" }), ann]));
  p1.appendChild(el("div", { style: "display:flex;gap:8px" }, [
    el("button", { class: "btn primary", text: "Post banner", onclick: async () => { try { await S.db.doc("meta/config").update({ announcement: ann.value.trim(), announcedBy: S.me.id, announcedAt: nowIso() }); toast(ann.value.trim() ? "Banner posted." : "Banner cleared."); } catch (e) { toast("Couldn't post that.", true); } } }),
    el("button", { class: "btn", text: "Clear", onclick: async () => { ann.value = ""; await S.db.doc("meta/config").update({ announcement: "" }); } })
  ]));
  w.appendChild(p1);

  /* join code + QR */
  const p2 = el("div", { class: "panel pad", style: "margin-top:14px" });
  p2.appendChild(el("h3", { text: "Joining" }));
  p2.appendChild(el("p", { class: "muted", style: "font-size:.87rem", text: "A join code keeps casual visitors out of the group. It isn't encryption — anyone your organisation has shared this page with can still reach the data — so treat it as a doorbell, not a lock." }));
  const pinOn = el("input", { type: "checkbox", checked: !!S.config.pinOn });
  const pin = el("input", { type: "text", value: S.config.pin || "", placeholder: "4–8 digits", class: "mono", maxlength: "8" });
  p2.appendChild(el("label", { class: "check" }, [pinOn, el("span", { class: "lbl", text: "Ask for a join code" })]));
  p2.appendChild(el("label", { class: "fld", style: "margin-top:10px;max-width:220px" }, [el("span", { text: "Current code" }), pin]));
  p2.appendChild(el("div", { style: "display:flex;gap:8px;flex-wrap:wrap" }, [
    el("button", { class: "btn primary", text: "Save code", onclick: async () => { try { await S.db.doc("meta/config").update({ pinOn: pinOn.checked, pin: pin.value.trim() }); LS.set("pinOk", pin.value.trim()); toast("Saved."); } catch (e) { toast("Couldn't save.", true); } } }),
    el("button", { class: "btn", text: "Generate a new one", onclick: () => { pin.value = String(Math.floor(1000 + Math.random() * 8999)); } }),
    el("button", { class: "btn", text: "Show joining screen", onclick: showJoinScreen })
  ]));
  w.appendChild(p2);

  /* people */
  const sec3 = el("div", { class: "sec" }, [el("h2", {}, [el("span", { text: "People" }), el("span", { class: "hint", text: knownPeople().length + " seen in this group" })])]);
  const p3 = el("div", { class: "panel rowlist" });
  const onlineIds = new Set(S.peers.map(p => p.presence && p.presence.uid));
  knownPeople().forEach(id => {
    const m = S.members[id] || {};
    const addr = S.addresses.find(x => x.id === id);
    const side = el("div", { class: "side" });
    if (id !== S.me.id) {
      side.appendChild(el("button", { class: "btn sm", text: m.muted ? "Unmute" : "Mute", onclick: () => setMember(id, { muted: !m.muted }) }));
      side.appendChild(el("button", { class: "btn ghost sm", text: m.removed ? "Restore" : "Remove", onclick: async () => {
        if (!m.removed && !(await confirmish("Remove this person?", "They lose access to the group until you restore them.", "Remove", true))) return;
        setMember(id, { removed: !m.removed });
      } }));
      side.appendChild(el("button", { class: "btn ghost sm", text: m.admin ? "Unmark admin" : "Mark as admin", onclick: () => setMember(id, { admin: !m.admin }) }));
    }
    p3.appendChild(el("div", { class: "row" }, [
      el("img", { class: "avatar", src: avatarOf(id) || "", alt: "" }),
      el("div", { class: "grow" }, [
        el("h3", {}, [el("span", { text: id === S.me.id ? (S.me.name || "You") + " (you)" : nameOf(id) }), m.admin ? el("span", { class: "chip c-advisory", style: "margin-left:7px", text: "admin" }) : null]),
        el("div", { class: "meta", text: [onlineIds.has(id) ? "online" : "offline", m.muted ? "muted" : null, m.removed ? "removed" : null, addr ? "address on file" : "no address"].filter(Boolean).join(" · ") })
      ]),
      side
    ]));
  });
  sec3.appendChild(p3); w.appendChild(sec3);

  /* addresses */
  const sec4 = el("div", { class: "sec" }, [el("h2", {}, [el("span", { text: "Resident addresses" }), el("span", { class: "hint", text: "served only to editors of this page" })])]);
  const p4 = el("div", { class: "panel rowlist" });
  if (!S.addresses.length) p4.appendChild(el("div", { class: "empty" }, [el("b", { text: "No addresses on file" }), el("span", { text: "Residents add theirs in Settings. If you were marked admin in the list above but aren't an editor of this page, the server won't serve them to you." })]));
  S.addresses.slice().sort((a, b) => (a.zone || "").localeCompare(b.zone || "")).forEach(a => {
    p4.appendChild(el("div", { class: "row" }, [
      el("div", { class: "grow" }, [
        el("h3", { text: nameOf(a.id) }),
        el("div", { class: "meta", text: [a.line, a.landmark, a.zone].filter(Boolean).join(" · ") }),
        el("div", { class: "meta", text: (a.people || 1) + " in household" + (a.phone ? " · " + a.phone : "") }),
        a.needs ? el("div", { style: "font-size:.88rem;margin-top:4px;color:var(--signal)", text: a.needs }) : null
      ]),
      el("div", { class: "side" }, [
        el("button", { class: "btn sm", text: "Message", onclick: () => { const k = dmKey(S.me.id, a.id); const cur = LS.get("dms", []); if (!cur.find(x => x.id === k)) { cur.push({ id: k, other: a.id, ts: Date.now() }); LS.set("dms", cur); } S.chan = { type: "dm", id: k }; go("chat"); } })
      ])
    ]));
  });
  sec4.appendChild(p4); w.appendChild(sec4);

  /* gauges */
  const sec5 = el("div", { class: "sec" }, [el("h2", {}, [el("span", { text: "Gauge readings" }), el("span", { class: "hint", text: "what the stage board shows" })])]);
  const p5 = el("div", { class: "panel pad" });
  (S.gauges || []).forEach((g, i) => {
    const lv = el("input", { type: "number", step: "0.1", value: g.level, style: "max-width:110px" });
    p5.appendChild(el("div", { style: "display:flex;gap:10px;align-items:center;padding:7px 0;border-top:" + (i ? "1px solid var(--line)" : "0") }, [
      el("div", { style: "flex:1;min-width:0" }, [el("div", { text: g.name, style: "font-size:.92rem" }), el("div", { class: "meta muted", style: "font-size:.78rem", text: "warn " + g.warn + " · danger " + g.danger + " " + g.unit })]),
      lv,
      el("button", { class: "btn sm", text: "Update", onclick: async () => {
        const gs = S.gauges.map(x => x.id === g.id ? Object.assign({}, x, { prev: x.level, level: +lv.value }) : x);
        try { await S.db.doc("meta/map").update({ gauges: gs, updatedAt: nowIso() }); toast("Reading updated."); } catch (e) { toast("Couldn't update.", true); }
      } })
    ]));
  });
  sec5.appendChild(p5); w.appendChild(sec5);

  /* zone risk */
  const sec6 = el("div", { class: "sec" }, [el("h2", {}, [el("span", { text: "Zone risk" })])]);
  const p6 = el("div", { class: "panel pad" });
  (S.mapcfg.zones || DEFAULT_ZONES).forEach((z, i) => {
    const seg = el("div", { class: "seg" });
    ["normal", "watch", "warning", "danger"].forEach(r => {
      const b = el("button", { text: r, onclick: async () => {
        const zs = (S.mapcfg.zones || DEFAULT_ZONES).map(x => x.id === z.id ? Object.assign({}, x, { risk: r }) : x);
        try { await S.db.doc("meta/map").update({ zones: zs, updatedAt: nowIso() }); } catch (e) { toast("Couldn't update.", true); }
      } });
      b.setAttribute("aria-pressed", z.risk === r ? "true" : "false");
      seg.appendChild(b);
    });
    p6.appendChild(el("div", { style: "display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:7px 0;border-top:" + (i ? "1px solid var(--line)" : "0") }, [el("span", { text: z.name }), seg]));
  });
  sec6.appendChild(p6); w.appendChild(sec6);

  /* housekeeping */
  const sec7 = el("div", { class: "sec" }, [el("h2", {}, [el("span", { text: "Housekeeping" })])]);
  sec7.appendChild(el("div", { class: "panel pad" }, [
    el("p", { class: "muted", style: "font-size:.87rem", text: "The shared store holds a few thousand documents. Pruning deletes the oldest chat messages and their voice notes; alerts, reports, shelters and addresses are untouched." }),
    el("div", { style: "display:flex;gap:8px;flex-wrap:wrap" }, [
      el("button", { class: "btn", text: "Prune chat to the last 150 messages", onclick: pruneMessages }),
      el("button", { class: "btn ghost", text: "Clear resolved SOS cards", onclick: clearResolvedSOS })
    ])
  ]));
  w.appendChild(sec7);
  v.appendChild(w); return v;
}
async function setMember(id, patch) {
  const cur = S.members[id] || {};
  const next = Object.assign({}, cur, patch, { updatedAt: nowIso() });
  delete next.id;
  try { await S.db.doc("members/" + id).set(next); }
  catch (e) { toast("Couldn't update that person.", true); }
}
async function pruneMessages() {
  if (!(await confirmish("Prune old messages?", "Everything older than the newest 150 messages is deleted for everyone.", "Prune", true))) return;
  try {
    const snap = await S.db.collection("messages").orderBy("ts", "desc").limit(1000).get();
    const docs = snap.docs.slice(150);
    for (const d of docs) {
      const m = d.data();
      if (m && m.media) { try { await S.db.doc("media/" + m.media).delete(); } catch (e) { } }
      try { await S.db.doc("messages/" + d.id).delete(); } catch (e) { }
    }
    toast("Pruned " + docs.length + " messages.");
  } catch (e) { toast("Couldn't prune right now.", true); }
}
async function clearResolvedSOS() {
  if (!(await confirmish("Clear resolved SOS cards?", "Resolved calls are deleted from the chat history.", "Clear", true))) return;
  const done = S.messages.filter(m => m.kind === "sos" && m.sos && m.sos.status === "resolved");
  for (const m of done) { try { await S.db.doc("messages/" + m.id).delete(); } catch (e) { } }
  toast("Cleared " + done.length + ".");
}
function showJoinScreen() {
  openModal("Joining screen", (body) => {
    body.appendChild(el("p", { class: "muted", style: "font-size:.88rem", text: "Put this on the control-room display. People scan the code to open MeridianSOS, then type the join code." }));
    const qr = el("div", { id: "qrbox" });
    body.appendChild(qr);
    const url = location.href.split("#")[0];
    if (window.QRCode) { try { new QRCode(qr, { text: url, width: 208, height: 208, correctLevel: QRCode.CorrectLevel.M }); } catch (e) { qr.textContent = "Couldn't draw the code."; } }
    else qr.appendChild(el("div", { class: "muted", style: "font-size:.85rem;padding:10px;text-align:center", text: "The QR library didn't load. Share the link below instead." }));
    body.appendChild(el("div", { style: "margin-top:12px" }, [
      el("div", { class: "muted", style: "font-size:.8rem", text: "Link" }),
      el("div", { class: "mono", style: "font-size:.78rem;word-break:break-all", text: url }),
      el("button", { class: "btn sm", style: "margin-top:8px", text: "Copy link", onclick: () => { navigator.clipboard.writeText(url).then(() => toast("Link copied."), () => toast("Copy failed.", true)); } })
    ]));
    if (S.config.pinOn && S.config.pin) body.appendChild(el("div", { style: "margin-top:14px;text-align:center" }, [
      el("div", { class: "muted", style: "font-size:.8rem", text: "Join code" }),
      el("div", { class: "mono", style: "font-size:2.2rem;letter-spacing:.3em", text: S.config.pin })
    ]));
  });
}

/* ============================================================
   Render
   ============================================================ */
let rerenderQueued = false;
function rerender() {
  if (rerenderQueued) return;
  rerenderQueued = true;
  requestAnimationFrame(() => { rerenderQueued = false; if (S.ready) { render(); buildNav(); renderPinBar(); } });
}
function render() {
  const host = $("#main");
  const prevScroll = $("#view") ? $("#view").scrollTop : 0;
  const sameView = host.dataset.view === S.view;
  host.innerHTML = "";
  host.dataset.view = S.view;
  if (S.view === "chat") {
    const c = viewChat();
    host.appendChild(c);
    renderChat(true);
    markChannelRead();
  } else {
    const v = el("div", { class: "view", id: "view" });
    let inner;
    switch (S.view) {
      case "map": inner = viewMap(); break;
      case "alerts": inner = viewAlerts(); break;
      case "shelters": inner = viewShelters(); break;
      case "report": inner = viewReport(); break;
      case "prepare": inner = viewPrepare(); break;
      case "settings": inner = viewSettings(); break;
      case "admin": inner = S.isAdmin ? viewAdmin() : viewDashboard(); break;
      default: inner = viewDashboard();
    }
    v.appendChild(inner);
    host.appendChild(v);
    if (sameView) v.scrollTop = prevScroll;
  }
  buildNav();
  renderPinBar();
  pushPresence();
}

/* keep admin status in step with the members roster */
function recomputeAdmin() {
  const was = S.isAdmin;
  const flagged = !!(S.me.id && S.members[S.me.id] && S.members[S.me.id].admin);
  S.isAdmin = !!(S.baseAdmin || flagged);
  $("#merole").textContent = S.isAdmin ? "Administrator" : "Citizen";
  if (was !== S.isAdmin) { buildNav(); rerender(); }
}

/* ============================================================
   Start
   ============================================================ */
window.addEventListener("resize", () => { if (S.view === "chat") renderChatHead(); });
window.addEventListener("beforeunload", () => { if (S.sosWatch != null) stopSOSTracking(); });

(async function start() {
  render();
  try { await boot(); } catch (e) { console.error(e); toast("Something went wrong starting up.", true); }
})();

</script>
</body>
